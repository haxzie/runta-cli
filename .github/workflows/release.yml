name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      # With pending changesets this opens/updates the "Version Packages" PR and stops.
      # Nothing is published to npm — every package is private.
      - name: Open or update the version PR
        uses: changesets/action@v1
        with:
          version: pnpm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Once that PR merges, main carries a bumped version with no matching tag. That
      # gap — not the action's output — is the signal to cut a release, which keeps this
      # correct even if the version bump lands by some other route.
      - name: Is there a version to release?
        id: check
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        if: steps.check.outputs.release == 'true'
        run: pnpm build:binaries

      # A release whose binary does not run is worse than no release. The linux-x64 build is
      # the one this runner can execute, and it exercises the same compile path as the rest.
      - name: Smoke-test the linux-x64 binary
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          tar -xzf dist/runta-linux-x64.tar.gz -C dist
          ./dist/runta hello release
          actual=$(./dist/runta --version)
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::Binary reports $actual but the release is $VERSION"
            exit 1
          fi
          rm -f dist/runta

      # install.sh resolves a version, downloads a tarball and verifies it against
      # checksums.txt. Run that against the freshly built artifacts before publishing them,
      # so a broken installer is caught here rather than by the first person to use it.
      - name: Verify install.sh against the built artifacts
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          python3 -m http.server 8799 --directory dist >/dev/null 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null "http://127.0.0.1:8799/checksums.txt" && break
            sleep 1
          done
          RUNTA_VERSION="v$VERSION" \
          RUNTA_BASE_URL="http://127.0.0.1:8799" \
          RUNTA_INSTALL_DIR="$RUNNER_TEMP/runta-bin" \
            sh scripts/install.sh
          "$RUNNER_TEMP/runta-bin/runta" --version

      - name: Publish GitHub Release
        if: steps.check.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # Only this version's changelog section, not the whole file. The "Patch Changes"
          # block is dropped: every package is private and pinned to one version, so
          # "Updated dependencies: @runta/core@X" is noise to anyone reading a release.
          awk -v ver="## $VERSION" '
            $0 == ver { inside = 1; next }
            inside && /^## / { exit }
            inside && /^### Patch Changes/ { inside = 0; exit }
            inside { print }
          ' apps/cli/CHANGELOG.md > release-notes.md

          # A release with empty notes means the changelog heading did not match the version,
          # which would otherwise ship a silently empty release.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No changelog section found for $VERSION in apps/cli/CHANGELOG.md"
            exit 1
          fi

          {
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo "curl -fsSL https://runta.haxzie.com/install.sh | sh"
            echo '```'
          } >> release-notes.md

          # `gh release create` creates the v<version> tag, which install.sh resolves
          # through the /releases/latest redirect.
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            dist/runta-darwin-arm64.tar.gz \
            dist/runta-darwin-x64.tar.gz \
            dist/runta-linux-arm64.tar.gz \
            dist/runta-linux-x64.tar.gz \
            dist/runta-linux-arm64-musl.tar.gz \
            dist/runta-linux-x64-musl.tar.gz \
            dist/checksums.txt
